  claims:
    - id: sequoia-attractions-hours
      basis: observed
      statement: Current NPS facility schedules list Foothills and Kings Canyon
        visitor centers from 8 am to 5 pm and Giant Forest Museum from 9 am to
        5 pm during the trip.
      sourceIds:
        - seki-facility-hours
    - id: sequoia-attractions-access
      basis: observed
      statement: Core Generals Highway, Giant Forest, Grant Grove, and Cedar
        Grove roads and attractions were open when checked.
      sourceIds:
        - seki-roads
        - seki-conditions
    - id: sequoia-attractions-cave
      basis: observed
      statement: Crystal Cave tours have ended for the 2026 season.
      sourceIds:
        - seki-cave
    - id: sequoia-attractions-priorities
      basis: recommended
      statement: Prioritize the giant sequoia groves, Moro Rock, Grant Grove,
        and a dedicated Kings Canyon Scenic Byway day.
      sourceIds:
        - seki-giant-forest
        - seki-drive-viewpoints
        - seki-grant-grove
        - seki-cedar-grove
