name: Pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn fmt:check
      - run: yarn typecheck
      - run: yarn build
      - run: yarn lint
      - run: yarn test
      - name: Verify committed Pages artifact
        run: |
          git status --short -- docs
          test -z "$(git status --porcelain --untracked-files=all -- docs)"
